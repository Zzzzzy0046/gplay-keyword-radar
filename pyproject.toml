[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gplay-keyword-radar"
version = "0.1.0"
description = "Zero-cost Google Play Store keyword monitoring and breakout opportunity discovery radar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "google-play-scraper>=1.2.7",
]

[project.scripts]
gplay-radar = "gplay_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
