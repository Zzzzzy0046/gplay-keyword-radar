# Google Play Keyword Radar Configuration
# Target: US English consumer app opportunity discovery (multi-country extensible)

storage:
  db_path: "data/radar.db"
  reports_dir: "data/reports"
  app_cache_ttl_days: 7

network:
  # Leave empty to automatically inherit system HTTP_PROXY / HTTPS_PROXY env vars
  proxy: ""
  timeout_seconds: 20
  min_delay_seconds: 0.6
  max_delay_seconds: 1.5
  max_retries: 3
  daily_request_budget: 800

markets:
  - country: "us"
    lang: "en"
    label: "US (English)"

# Google Play categories for Top Free & Top Grossing monitoring
charts:
  enabled: true
  collections:
    - "topselling_free"
    - "topgrossing"
  top_n_free: 100
  top_n_grossing: 50
  # Apps in Top 100 with <= dark_horse_max_installs OR rank jump >= dark_horse_rank_jump
  dark_horse_max_installs: 1000000
  dark_horse_rank_jump: 15
  categories:
    - "TOOLS"
    - "PRODUCTIVITY"
    - "HEALTH_AND_FITNESS"
    - "PHOTOGRAPHY"
    - "ENTERTAINMENT"

# Seed keywords grouped by consumer app verticals
# core_expand_az: true -> expands with rotated letters each day (or full a-z if letters_per_day = 26)
suggest:
  enabled: true
  # Number of a-z expansion letters per core seed per day (rotates deterministically by day-of-year;
  # set to 26 for full a-z every day, or 6-8 for fast low-noise daily runs)
  az_letters_per_day: 6
  intent_prefixes:
    - "ai"
    - "free"
  seed_groups:
    tools_utility:
      expand_az: true
      seeds:
        - "pdf scanner"
        - "smart printer"
        - "find my phone"
        - "airtag detector"
        - "phone cleaner"
        - "qr scanner"
        - "coin identifier"
        - "plant identifier"
    productivity_ai:
      expand_az: true
      seeds:
        - "ai note taker"
        - "voice recorder"
        - "document reader"
        - "ai translator"
        - "resume builder"
    health_wellness:
      expand_az: false
      seeds:
        - "heart rate monitor"
        - "blood pressure tracker"
        - "calorie counter"
        - "sleep tracker"
        - "fasting tracker"
    media_entertainment:
      expand_az: false
      seeds:
        - "short drama"
        - "reel drama"
        - "ai photo editor"
        - "video enhancer"
        - "game emulator"

funnel:
  # Max chart dark-horse phrases to expand through Suggest each run
  max_chart_phrases_to_suggest: 25
  # Max top candidate keywords to enrich with Google Play SERP Top 10 + App Details
  max_serp_candidates: 35
  serp_top_n: 10
  # Max top scored candidates to validate with Google Trends (batched 5 per call -> ~4 calls)
  max_trends_candidates: 20
  trends_enabled: true
  trends_timeframe: "today 1-m"

scoring:
  # Thresholds for "entry opportunity" (small/new app friendliness)
  new_app_age_days: 365
  fresh_app_age_days: 180
  small_app_max_installs: 1000000
  giant_app_min_installs: 50000000
  # Brand auto-detection thresholds
  brand_giant_installs: 10000000
  brand_giant_ratings: 100000
  # Extra static brand/noise terms to filter or demote
  blacklist_terms:
    - "google"
    - "youtube"
    - "whatsapp"
    - "facebook"
    - "instagram"
    - "tiktok"
    - "snapchat"
    - "spotify"
    - "netflix"
    - "amazon"
    - "temu"
    - "shein"
    - "roblox"
    - "minecraft"
    - "chatgpt"
    - "telegram"
    - "discord"
    - "twitter"
    - "pinterest"
    - "reddit"
    - "uber"
    - "lyft"
    - "doordash"
    - "paypal"
    - "venmo"
    - "cash app"
    - "walmart"
    - "target"
    - "apple"
    - "samsung"
    - "microsoft"
    - "zoom"
    - "gmail"
    - "chrome"
    - "play store"

reporting:
  top_opportunities_limit: 20
  top_brand_watchlist_limit: 8
  top_dark_horse_apps_limit: 15
  dingtalk:
    enabled: false
    # Recommended: set DINGTALK_WEBHOOK_URL and DINGTALK_SECRET via environment variables
    webhook_url: ""
    secret: ""
    top_n: 8
