# Google Play Keyword Radar Configuration
# Multi-market consumer app opportunity discovery (US + EU + LATAM + SEA & MENA)

storage:
  db_path: "data/radar.db"
  reports_dir: "data/reports"
  app_cache_ttl_days: 7

network:
  # Leave empty to automatically inherit system HTTP_PROXY / HTTPS_PROXY env vars
  proxy: ""
  timeout_seconds: 20
  min_delay_seconds: 0.6
  max_delay_seconds: 1.5
  max_retries: 3
  # Sized to cover all 10 markets in one sweep with global AppDetail caching
  daily_request_budget: 2500

# Tiered market list:
# - deep: full a-z seed expansion + Top 35 SERP + Top 20 Trends
# - radar: category charts + localized core seeds + dark-horse 2-hop + Top 15 SERP + Top 10 Trends
# Use `--market de` or `--region eu|latam|sea_mena|na` to run subsets anytime.
markets:
  # North America (Deep)
  - country: "us"
    lang: "en"
    label: "US (English)"
    region: "na"
    tier: "deep"

  # Tier-1 Non-English Europe (EU)
  - country: "de"
    lang: "de"
    label: "Germany (Deutsch)"
    region: "eu"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10
  - country: "fr"
    lang: "fr"
    label: "France (Français)"
    region: "eu"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10
  - country: "es"
    lang: "es"
    label: "Spain (Español)"
    region: "eu"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10

  # High-Volume Latin America (LATAM)
  - country: "br"
    lang: "pt"
    label: "Brazil (Português)"
    region: "latam"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10
  - country: "mx"
    lang: "es"
    label: "Mexico (Español)"
    region: "latam"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10

  # Southeast Asia & Middle East (SEA & MENA)
  - country: "id"
    lang: "id"
    label: "Indonesia (Bahasa)"
    region: "sea_mena"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10
  - country: "in"
    lang: "en"
    label: "India (English)"
    region: "sea_mena"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10
  - country: "sa"
    lang: "ar"
    label: "Saudi Arabia (العربية)"
    region: "sea_mena"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10
  - country: "tr"
    lang: "tr"
    label: "Turkey (Türkçe)"
    region: "sea_mena"
    tier: "radar"
    expand_az: false
    max_chart_phrases_to_suggest: 12
    max_serp_candidates: 15
    max_trends_candidates: 10

charts:
  enabled: true
  collections:
    - "topselling_free"
    - "topgrossing"
  top_n_free: 100
  top_n_grossing: 50
  dark_horse_max_installs: 1000000
  dark_horse_rank_jump: 15
  categories:
    - "TOOLS"
    - "PRODUCTIVITY"
    - "HEALTH_AND_FITNESS"
    - "PHOTOGRAPHY"
    - "ENTERTAINMENT"

suggest:
  enabled: true
  az_letters_per_day: 6
  intent_prefixes:
    - "ai"
    - "free"
  intent_prefixes_by_lang:
    en: ["ai", "free"]
    de: ["ki", "kostenlos"]
    fr: ["ia", "gratuit"]
    es: ["ia", "gratis"]
    pt: ["ia", "gratis"]
    id: ["ai", "gratis"]
    tr: ["yapay zeka", "ücretsiz"]
    ar: ["ذكاء اصطناعي"]

  # Localized seed libraries per language (auto-selected by market.lang)
  seed_sets_by_lang:
    en:
      tools_utility:
        expand_az: true
        seeds:
          - "pdf scanner"
          - "smart printer"
          - "find my phone"
          - "airtag detector"
